<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Path | Login</title>
    
    <!-- CDN de Ionic (CSS y JS) - ESTO ES LO QUE FALTA EN TU IMAGEN -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    
    <style>
        /* Estilo rápido para centrar todo mientras creas tu archivo CSS */
        body { background-color: #0000000a; }
        .login-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        ion-card { width: 100%; max-width: 400px; --background: #5e5e5e5a; color: white; }
    </style>
</head>

<body class="ion-palette-dark">
    <!-- ion-app es OBLIGATORIO para que Ionic funcione -->
    <ion-app>
        <ion-content>
            <div class="login-wrapper">
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <h1 style="font-size: 3em; font-weight: 800; margin-bottom: 0;">Health Path</h1>
                    <p style="color: #8a8a8e;">Entrena con inteligencia</p>
                </div>

                <ion-card>
                    <ion-card-content>
                        <ion-list lines="full" style="background: transparent;">
                            <ion-item style="--background: transparent;">
                                <ion-label position="floating">Correo electrónico</ion-label>
                                <ion-input type="email" id="login-email"></ion-input>
                            </ion-item>
                            <ion-item style="--background: transparent;">
                                <ion-label position="floating">Contraseña</ion-label>
                                <ion-input type="password" id="login-password"></ion-input>
                            </ion-item>
                        </ion-list>

                        <ion-button expand="block" style="margin-top: 20px;" onclick="iniciarSesion()">
                            Entrar
                        </ion-button>

                        <ion-button expand="block" fill="clear" color="medium" size="small">
                            ¿Olvidaste tu contraseña? <a href="#"> Cambiar contraseña</a>
                        </ion-button>
                    </ion-card-content>
                </ion-card>

                <p style="margin-top: 20px; color: #8a8a8e;">
                    ¿No tienes cuenta? <a href="register.html" style="color: #3880ff; text-decoration: none;">Regístrate</a>
                </p>

            </div>
        </ion-content>
    </ion-app>

    <script>
        function validarLogin() {
            const email = document.getElementById('login-email').value;
            if(email) {
                alert('Conectando con Render para: ' + email);
                // Aquí irá tu fetch a la base de datos de Render
            } else {
                alert('Por favor pon un correo');
            }
        }
    </script>

    <script src="js/auth.js"></script>
</body>
</html>
