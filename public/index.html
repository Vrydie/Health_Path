<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Path | Login</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4fd1c5">
    <link rel="apple-touch-icon" href="/assets/logo.png">
    <style>
        :root {
            --accent: #4fd1c5;
            --accent2: #667eea;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.06);
            --glass-blur: blur(24px) saturate(180%);
            --radius: 24px;
            --font-display: 'Sora', system-ui, sans-serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
            --ion-background-color: #040408;
            --ion-text-color: #ffffff;
            --ion-card-background: transparent;
        }

        * { box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #020205 0%, #06061a 45%, #040c10 100%) !important;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Orbes de ambiente */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(79,209,197,0.07) 0%, transparent 70%);
            top: -120px; right: -120px;
            animation: orb1 9s ease-in-out infinite alternate;
        }
        body::after {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(102,126,234,0.05) 0%, transparent 70%);
            bottom: -150px; left: -120px;
            animation: orb2 11s ease-in-out infinite alternate;
        }
        @keyframes orb1 { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,-30px) scale(1.1); } }
        @keyframes orb2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-30px,40px) scale(1.08); } }

        ion-app { background: transparent !important; position: relative; z-index: 1; }
        ion-content { --background: transparent; }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeUp 0.8s ease forwards;
        }
        .logo-mark {
            font-size: 2.2rem;
            color: var(--accent);
            opacity: 0.8;
            margin-bottom: 12px;
            animation: pulse 3s ease infinite;
        }
        .logo-area h1 {
            font-family: var(--font-display) !important;
            font-size: 3rem !important;
            font-weight: 800 !important;
            margin: 0 !important;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 55%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-area p {
            font-family: var(--font-body) !important;
            color: rgba(255,255,255,0.38) !important;
            font-size: 0.9rem;
            margin-top: 6px !important;
            letter-spacing: 0.05em;
        }

        /* Card de vidrio */
        ion-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass) !important;
            backdrop-filter: var(--glass-blur) !important;
            -webkit-backdrop-filter: var(--glass-blur) !important;
            border: 1px solid var(--glass-border) !important;
            border-radius: var(--radius) !important;
            box-shadow: 0 28px 70px rgba(0,0,0,0.75), 0 1px 0 rgba(255,255,255,0.05) inset !important;
            overflow: hidden;
            position: relative;
            animation: fadeUp 0.7s ease 0.2s backwards;
        }
        ion-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            z-index: 2;
        }

        /* Items */
        ion-item {
            --background: rgba(255,255,255,0.03) !important;
            --border-color: rgba(255,255,255,0.1) !important;
            --color: rgba(255,255,255,0.9) !important;
            --padding-start: 16px;
            --inner-padding-end: 16px;
            border-radius: 14px !important;
            margin-bottom: 10px !important;
            border: 1px solid rgba(255,255,255,0.06) !important;
            transition: border-color 0.25s;
        }
        ion-item:focus-within {
            border-color: rgba(79,209,197,0.4) !important;
        }
        ion-item::part(native) { background: transparent; border-radius: 14px; }

        ion-label {
            font-family: var(--font-body) !important;
            font-size: 0.82rem !important;
            color: rgba(255,255,255,0.5) !important;
        }
        ion-input {
            --color: #fff !important;
            --placeholder-color: rgba(255,255,255,0.28) !important;
            font-family: var(--font-body) !important;
            caret-color: var(--accent) !important;
        }
        ion-list { background: transparent !important; }

        /* Botón principal */
        ion-button[expand="block"]:not([fill="clear"]):not([color]) {
            --background: linear-gradient(135deg, rgba(79,209,197,0.75), rgba(102,126,234,0.75)) !important;
            --border-radius: 999px !important;
            --box-shadow: 0 4px 24px rgba(79,209,197,0.18) !important;
            --color: #fff !important;
            font-family: var(--font-display) !important;
            font-weight: 600 !important;
            font-size: 0.95rem !important;
            letter-spacing: 0.01em;
            border: 1px solid rgba(255,255,255,0.2) !important;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        ion-button[expand="block"]:not([fill="clear"]):not([color]):hover {
            transform: translateY(-1px);
            --box-shadow: 0 8px 32px rgba(79,209,197,0.45) !important;
        }

        /* Botón ghost */
        ion-button[fill="clear"] {
            --color: rgba(255,255,255,0.4) !important;
            font-family: var(--font-body) !important;
        }

        /* Link */
        a { color: var(--accent) !important; text-decoration: none; }

        .footer-text {
            margin-top: 24px !important;
            color: rgba(255,255,255,0.4) !important;
            font-size: 0.88rem !important;
            animation: fadeUp 0.7s ease 0.4s backwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(22px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%,100% { opacity: 0.5; transform: scale(1); }
            50%      { opacity: 1; transform: scale(1.15); }
        }

        @media (max-width: 400px) {
            .logo-area h1 { font-size: 2.3rem !important; }
        }
    </style>
</head>

<body class="ion-palette-dark">
    <ion-app>
        <ion-content>
            <div class="login-wrapper">

                <div class="logo-area">
                    <img src="/assets/logo.png" alt="Health Path Logo" style="width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; border-radius: 20px; box-shadow: 0 10px 30px rgba(79,209,197,0.3);">
                    <h1>Health Path</h1>
                    <p>Entrena con inteligencia</p>
                </div>

                <ion-card>
                    <ion-card-content>
                        <ion-list lines="none" style="background: transparent; padding: 8px 0;">
                            <ion-item>
                                <ion-label position="floating">Correo electrónico</ion-label>
                                <ion-input type="email" id="login-email"></ion-input>
                            </ion-item>
                            <ion-item>
                                <ion-label position="floating">Contraseña</ion-label>
                                <ion-input type="password" id="login-password"></ion-input>
                            </ion-item>
                        </ion-list>

                        <ion-button expand="block" style="margin-top: 20px;" onclick="iniciarSesion()">
                            Entrar
                        </ion-button>

                        <ion-button expand="block" fill="clear" color="medium" size="small">
                            ¿Olvidaste tu contraseña? <a href="#" style="margin-left:4px; color: var(--accent);">Cambiar contraseña</a>
                        </ion-button>
                    </ion-card-content>
                </ion-card>

                <p class="footer-text">
                    ¿No tienes cuenta? <a href="register.html">Regístrate</a>
                </p>

            </div>
        </ion-content>
    </ion-app>

    <script>
        function validarLogin() {
            const email = document.getElementById('login-email').value;
            if(email) {
                alert('Conectando con Render para: ' + email);
            } else {
                alert('Por favor pon un correo');
            }
        }
    </script>
    <script src="js/auth.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado', reg))
            .catch(err => console.error('Error al registrar Service Worker', err));
        });
      }
    </script>
</body>
</html>
